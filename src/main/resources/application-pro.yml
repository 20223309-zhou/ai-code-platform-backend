spring:
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/intelligent_picture?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: root
    password: 1234
  #redis配置
  data:
    redis:
      username: default
      ttl: 3600
      database: 0
      host: redis
      port: 6379
      password: 123456
      timeout: 5000
# AI
langchain4j:
  open-ai:
    chat-model:
      # 严格确保结构化输出生效
      strict-json-schema: true
      response-format: json_object
      max-tokens: 8192
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      model-name: ${AI_MODEL_NAME}
      log-requests: true
      log-responses: true
    streaming-chat-model:
      max-tokens: 8192
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      model-name: ${AI_MODEL_NAME}
      log-requests: true
      log-responses: true
