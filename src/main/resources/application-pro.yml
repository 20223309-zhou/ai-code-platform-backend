spring:
  security:
    #登录配置
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
            redirect-uri: ${FRONTEND_HOME_PAGE_URL}/api/login/oauth2/code/github
  #数据库配置
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://${SPRING_MYSQL_URL}:${SPRING_MYSQL_PORT}/ai_code_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf-8
#    username: root
#    password: ${SPRING_MYSQL_PASSWORD}
  # 数据库配置（配置主从读写分离的路由规则）
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # 指向外部或类路径下的 sharding 规则配置文件
    url: jdbc:shardingsphere:classpath:sharding-pro.yml
  #redis配置
  data:
    redis:
      username: default
      ttl: 3600
      database: 0
      host: ${SPRING_REDIS_URL}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 5000
  # 邮件配置（邮箱注册验证码）
  # 注意：password 必须填邮箱服务商给出的「授权码」，不是邮箱登录密码
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
# AI
langchain4j:
  open-ai:
    # 推理 AI 模型配置（用于复杂的推理任务）—— 多模型：deepseek / grok / chatgpt
    # 注意：键名必须与 ReasoningStreamingChatModelConfig 的字段一一对应，否则模型配置会全部绑定为 null
    reasoning-streaming-chat-model:
      # 默认模型：DeepSeek（直连官方）
      deepseek-base-url: ${BBLABU_BASE_URL}
      deepseek-api-key: ${AI_API_KEY}
      deepseek-model-name: ${AI_MODEL_NAME}
      # Grok / ChatGPT 走 bblabu 网关
      bblabu-base-url: ${BBLABU_BASE_URL}
      grok-api-key: ${GROK_API_KEY}
      grok-model-name: ${GROK_MODEL_NAME}
      chatgpt-api-key: ${CHATGPT_API_KEY}
      chatgpt-model-name: ${CHATGPT_MODEL_NAME}
      max-tokens: 62768
      temperature: 0.7
      log-requests: false
      log-responses: false
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: ${ROUTING_AI_BASE_URL}
      api-key: ${ROUTING_AI_API_KEY}
      model-name: ${ROUTING_AI_MODEL_NAME}
      max-tokens: 100
      temperature: 0.7
      log-requests: false
      log-responses: false
    chat-model:
      # 严格确保结构化输出生效
#      strict-json-schema: true
#      response-format: json_object
      max-tokens: 8192
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      model-name: ${AI_MODEL_NAME}
      log-requests: false
      log-responses: false
      timeout: PT120S
cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}

# Pexels 图片搜索配置
pexels:
  api-key: ${PEXELS_API_KEY}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY}
  image-model: wanx2.1-t2i-turbo

#部署路径
code:
  deploy-path: http://www.icodeplay.site/dist

# Qdrant 向量数据库配置
qdrant:
  host: ${QDRANT_URL}
  port: ${QDRANT_PORT}
  collection-name: code_embeddings
  vector-size: 512  # BGE-Small-ZH-V1.5 的向量维度
  distance-type: Cosine
# 生产地址
frontend:
  homePageUrl: ${FRONTEND_HOME_PAGE_URL}
  authUrl: ${FRONTEND_AUTH_URL}

# 会话历史回放预算（冷启动重建对话记忆时用）
app:
  chat-history:
    replay-max-tokens: ${CHAT_HISTORY_REPLAY_MAX_TOKENS:64000}
    scan-limit: ${CHAT_HISTORY_SCAN_LIMIT:400}
    keep-user-ai-rounds: ${CHAT_HISTORY_KEEP_USER_AI_ROUNDS:10}
    keep-tool-rounds: ${CHAT_HISTORY_KEEP_TOOL_ROUNDS:3}
  # 邮箱验证码相关配置
  mail:
    from: ${MAIL_FROM:}                          # 发件地址，留空则回退用 spring.mail.username
    from-name: ${MAIL_FROM_NAME:iCodeAI}         # 发件人展示名
    code-expire-minutes: ${MAIL_CODE_EXPIRE_MINUTES:5}
    send-cooldown-seconds: ${MAIL_SEND_COOLDOWN_SECONDS:60}
    daily-limit-per-email: ${MAIL_DAILY_LIMIT_PER_EMAIL:10}
    daily-limit-per-ip: ${MAIL_DAILY_LIMIT_PER_IP:30}
    max-verify-fail: ${MAIL_MAX_VERIFY_FAIL:5}